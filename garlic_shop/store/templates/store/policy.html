{% extends 'store/base.html' %}

{% block content %}
<section class="container py-5">
    <div class="mx-auto" style="max-width: 880px;">
        <div class="card border-0 shadow-sm p-4 p-lg-5">
            <span class="text-success fw-bold text-uppercase small">GarlicShop policy</span>
            <h1 class="fw-bold mt-2 mb-3">{{ policy.title }}</h1>
            <p class="text-muted fs-5">{{ policy.intro }}</p>
            <hr>
            <div class="vstack gap-3">
                {% for point in policy.points %}
                <div class="d-flex gap-3">
                    <i class="fas fa-circle-check text-success mt-1"></i>
                    <p class="mb-0">{{ point }}</p>
                </div>
                {% endfor %}
            </div>
            <div class="alert alert-success mt-4 mb-0">
                Support ke liye WhatsApp karein:
                <a class="fw-bold text-success" href="{{ whatsapp_url }}" target="_blank" rel="noopener">{{ whatsapp_display_number }}</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
