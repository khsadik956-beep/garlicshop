{% extends 'store/base.html' %}

{% block content %}
<section class="container py-5">
    <div class="row g-4 justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-4">
                <span class="badge bg-success align-self-start mb-3">{{ plan.delivery_frequency }}</span>
                <h2 class="fw-bold">{{ plan.name }}</h2>
                <p class="text-muted">{{ plan.description }}</p>
                <h3 class="fw-bold text-success">Rs. {{ plan.price }}</h3>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="fw-bold mb-3">Request Subscription</h4>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Name</label>
                        <input name="name" class="form-control" value="{{ request.user.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone</label>
                        <input name="phone" class="form-control" maxlength="10" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Delivery Address</label>
                        <textarea name="address" class="form-control" rows="4" required></textarea>
                    </div>
                    <button class="btn btn-success w-100 fw-bold">Send Request</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
