{% extends 'store/shop_admin/base.html' %}
{% block title %}Delete{% endblock %}
{% block content %}
<h1 class="page-title">Delete Confirmation</h1>
<div class="panel">
    <p>Are you sure you want to delete <strong>{{ object_name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button class="btn btn-danger">Yes, Delete</button>
        <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
