<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Garlic Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .btn-warning { background-color: #ffc107; border: none; color: #000; }
        .btn-warning:hover { background-color: #e0a800; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; }
        label { font-weight: 600; color: #495057; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">🧄 Garlic Shop</h2>
                    <p class="text-muted">Welcome back! Please login to your account</p>
                </div>
                <div class="card p-4 p-sm-5 bg-white">
                    <h4 class="fw-bold mb-4 text-center text-secondary">Customer Login</h4>
                    
                    <form method="POST" autocomplete="off">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2.5 rounded-3 mt-2">Log In 🔐</button>
                    </form>
                    
                    <hr class="text-muted my-4">
                    <p class="text-center mb-0 small">New to Garlic Shop? <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-dark">Create an account</a></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
